name: CI

on:
  push:
    branches: [ main, master, feature/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all modules
        run: |
          for f in deep_binance_analysis.py directional_binance_agents.py \
                   exchange_prices.py config_loader.py backtest_directional.py \
                   backtest_moonshot.py evaluate_signals.py options_data.py \
                   news_feed.py trade_brief.py claude_client.py; do
            python -m py_compile "$f"
          done
      - name: Run tests
        run: pytest -q
      - name: Test API import
        run: python -c "from api import app; print('API:', app.title)"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t hermes-foundation .
